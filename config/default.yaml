model:
  local_id: BIOMEDICA/BMC-smolvlm1-256M
  processor_id: HuggingFaceTB/SmolVLM-256M-Instruct
  max_new_tokens: 128
  classification_max_tokens: 48

modalities:
  radiology:
    label: Radiology (Chest X-ray)
    system_prompt: >
      You are an expert radiologist assistant. Provide findings, a concise diagnosis,
      and a brief explanation grounded in visible image evidence. Research use only.
    classifier_system_prompt: >
      You are a chest X-ray classification assistant. Follow the label format exactly.
      Research use only.
    report_prompt: >
      Analyze this chest X-ray. Provide: (1) key findings, (2) likely diagnosis,
      (3) brief explanation of visual evidence.
    cxr_binary_prompt: >
      Is pneumonia or focal airspace consolidation present on this chest X-ray?
      Answer with exactly one word: yes or no.
    vqa_prompt: >
      Look at this chest X-ray and answer the question using only visible evidence.
      Reply with exactly one word: yes or no.
      Question: {question}
    default_manifest: data/test_cxr/manifest.json
    example_dir: data/test_cxr/images

  pathology:
    label: Digital Pathology (H&E)
    system_prompt: >
      You are an expert pathologist assistant. Describe tissue morphology, cell patterns,
      and likely diagnosis grounded in visible H&E evidence. Research use only.
    classifier_system_prompt: >
      You are a histopathology classification assistant. Follow the label format exactly.
      Research use only.
    report_prompt: >
      Analyze this histopathology image. Provide: (1) tissue architecture and cellular
      features, (2) likely diagnosis or differential, (3) explanation of visual evidence.
    pathology_prompt: >
      What is the best diagnosis category for this H&E histopathology image?
      Reply with exactly one word from: malignant, metastatic, deposition, benign.
    default_manifest: data/test_pathology/manifest.json
    example_dir: data/test_pathology/images

  mri:
    label: Magnetic Resonance Imaging (MRI)
    system_prompt: >
      You are an expert neuroradiologist & MRI specialist assistant. Analyze brain, spine,
      or tissue MRI scans for intensity abnormalities, lesions, structural alignment, and pathology. Research use only.
    report_prompt: >
      Analyze this MRI scan. Provide: (1) key anatomical & signal intensity findings,
      (2) differential diagnosis, (3) visual evidence summary.

  cbc:
    label: Complete Blood Count (CBC)
    system_prompt: >
      You are an expert hematology assistant. Analyze CBC lab result reports, white blood cell, red blood cell, hemoglobin, hematocrit, and platelet parameters. Research use only.
    report_prompt: >
      Analyze this CBC blood report image. Provide: (1) key abnormal parameters (WBC, RBC, Hgb, Plt),
      (2) clinical interpretation (e.g. anemia, leukocytosis), (3) summary of findings.

  blood_tests:
    label: Comprehensive Blood Tests & Metabolic Panels
    system_prompt: >
      You are a clinical laboratory diagnostics assistant. Analyze blood chemistry panels, metabolic markers, lipid panels, and biomarker reports. Research use only.
    report_prompt: >
      Analyze this blood test panel report. Provide: (1) identified out-of-range biomarkers,
      (2) clinical significance, (3) diagnostic recommendations.

  pulse_oximetry:
    label: Pulse Oximetry (SpO2 & Waveform)
    system_prompt: >
      You are a critical care diagnostics assistant. Analyze pulse oximeter readings, SpO2 percentages, pulse rate, and plethysmogram waveforms. Research use only.
    report_prompt: >
      Analyze this pulse oximetry reading or waveform. Provide: (1) SpO2 level & oxygenation status,
      (2) pulse rate assessment, (3) clinical risk observation.

  flu_testing:
    label: Rapid Flu & Respiratory Testing
    system_prompt: >
      You are an infectious disease diagnostic assistant. Analyze rapid influenza swab test cassettes, antigen bands, and diagnostic test strips. Research use only.
    report_prompt: >
      Analyze this rapid flu test image. Provide: (1) control band status,
      (2) Flu A / Flu B test band interpretation (positive/negative/invalid), (3) clinical summary.

pathology:
  wsi:
    default_tile_mode: center
    patch_size: 512
    stride: 512

xai:
  output_dir: outputs/xai
  alpha: 0.45
  fast: true

paths:
  outputs: outputs

disclaimer: Research and educational use only. Not for clinical diagnosis.

